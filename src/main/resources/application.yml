server:
  port: 8080

spring:
  application:
    name: hexagonal-architecture-scaffold
  profiles:
    active: ${NOTIFICATION_ADAPTER:console}
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      region:
        static: ${AWS_REGION:us-east-1}
      sns:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      sqs:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  messaging:
    # LocalStack always uses this fixed dummy account id, so the ARN is
    # deterministic across runs (see localstack-init/init-aws.sh).
    sns-topic-arn: ${ORDERS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:orders-created-topic}
    sqs-queue-name: ${ORDERS_QUEUE_NAME:orders-created-queue}

resilience4j:
  retry:
    instances:
      snsPublisher:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      snsPublisher:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
