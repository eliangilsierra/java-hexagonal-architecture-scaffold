server:
  port: 8080

spring:
  application:
    name: hexagonal-architecture-scaffold
  profiles:
    active: ${NOTIFICATION_ADAPTER:console}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
